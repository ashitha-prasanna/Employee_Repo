spring.application.name=EmployeeApp
# Hosting platforms (Render, Railway, ...) pass the port in $PORT; 8081 locally
server.port=${PORT:8081}

# Database: in-memory H2 locally; set DB_URL / DB_USER / DB_PASS in production, e.g.
#   DB_URL=jdbc:postgresql://<host>:5432/<db>   or   jdbc:mysql://<host>:3306/<db>
spring.datasource.url=${DB_URL:jdbc:h2:mem:employees}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
# Create/alter the employee table automatically, keep existing data
spring.jpa.hibernate.ddl-auto=update

# Comma-separated front-end origins allowed to call the API, e.g. https://my-app.netlify.app
app.cors.allowed-origins=${CORS_ORIGINS:*}
